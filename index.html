<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TYPE HERO – Full Game Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', 'Thonburi', sans-serif;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        header {
            background-color: rgba(30, 41, 59, 0.9);
            border-bottom: 2px solid #334155;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            background: linear-gradient(to right, #4f46e5, #9333ea);
            font-weight: 800;
            font-size: 1.1rem;
            padding: 6px 14px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .controls-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select {
            background-color: #334155;
            color: #fde047;
            font-weight: bold;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            cursor: pointer;
            outline: none;
        }

        .stats-hud { display: flex; gap: 12px; font-size: 0.85rem; }
        .stat-box {
            background-color: rgba(51, 65, 85, 0.6);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid #475569;
        }
        .stat-val { font-weight: bold; color: #facc15; }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            cursor: pointer;
        }

        .battle-screen {
            width: 100%;
            max-width: 900px;
            height: 200px;
            background: linear-gradient(to bottom, #0f172a, #0c4a6e, #1e1b4b);
            border-radius: 16px;
            border: 3px solid #334155;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px 25px;
            position: relative;
            overflow: hidden;
        }

        .hp-bars {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .hp-container { width: 42%; }
        .hp-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .hp-bg {
            width: 100%;
            background-color: rgba(15, 23, 42, 0.8);
            height: 14px;
            border-radius: 10px;
            border: 1px solid #475569;
            overflow: hidden;
        }

        .hp-fill-hero {
            background-color: #22c55e;
            height: 100%;
            width: 100%;
            transition: width 0.3s ease;
        }

        .hp-fill-monster {
            background-color: #f43f5e;
            height: 100%;
            width: 100%;
            float: right;
            transition: width 0.3s ease;
        }

        .vs-badge {
            background-color: #e11d48;
            color: white;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        .stage {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 40px;
            flex: 1;
        }

        .sprite-img {
            max-width: 90px;
            max-height: 90px;
            object-fit: contain;
            transition: transform 0.15s ease;
            filter: drop-shadow(0 8px 6px rgba(0,0,0,0.6));
        }

        .attack-hero { transform: translateX(140px) scale(1.15); }
        .hit-monster { transform: scale(0.85); filter: brightness(2) drop-shadow(0 0 15px red); }

        .target-card {
            margin-top: 10px;
            background-color: rgba(30, 41, 59, 0.95);
            border: 2px solid #fbbf24;
            border-radius: 16px;
            padding: 10px 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 450px;
            max-width: 900px;
            width: 90%;
        }

        .target-label {
            font-size: 0.75rem;
            color: #fde047;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .word-container {
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            min-height: 70px;
            line-height: 1.6;
            gap: 2px;
            text-align: center;
        }

        .word-container span {
            display: inline-block;
            position: relative;
            padding: 0 1px;
        }

        .char-correct { color: #4ade80; }
        .char-current { 
            color: #facc15; 
            border-bottom: 4px solid #facc15; 
        }
        .char-pending { color: #64748b; }
        .space-char { padding: 0 8px !important; }

        .finger-hint {
            margin-top: 4px;
            font-size: 0.8rem;
            color: #a5b4fc;
            background-color: rgba(30, 27, 75, 0.8);
            padding: 2px 14px;
            border-radius: 20px;
            border: 1px solid #3730a3;
        }

        footer {
            background-color: #020617;
            border-top: 2px solid #1e293b;
            padding: 10px 10px 5px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .keyboard-wrapper {
            background-color: rgba(15, 23, 42, 0.95);
            padding: 10px;
            border-radius: 12px;
            width: 100%;
            max-width: 920px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            border: 1px solid #334155;
        }

        .kb-row { display: flex; gap: 4px; width: 100%; }
        
        .key-base {
            height: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 6px;
            background-color: #1e293b;
            border: 1px solid #334155;
            flex: 1;
            font-size: 0.85rem;
            color: #facc15;
            font-weight: bold;
        }

        .key-special {
            background-color: #0f172a;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .key-sub { font-size: 0.6rem; color: #64748b; position: absolute; top: 2px; right: 4px; }
        .glow-key { 
            box-shadow: 0 0 12px #facc15; 
            border-color: #facc15 !important; 
            background-color: #334155 !important;
            color: #ffffff !important;
        }

        .credit-footer {
            margin-top: 6px;
            font-size: 0.75rem;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
        .credit-footer span {
            color: #38bdf8;
            font-weight: bold;
        }

        #hidden-input { position: absolute; opacity: 0; top: -1000px; }
    </style>
</head>
<body>

    <input type="text" id="hidden-input" autocomplete="off">

    <header>
        <div class="brand">⚔️ TYPE HERO</div>
        <div class="controls-group">
            <label for="mode-select" style="font-size: 0.85rem; font-weight: bold;">เลือกโหมด:</label>
            <select id="mode-select" onchange="changeMode(this.value)">
                <option value="easy">🟢 ง่าย (คำสั้น)</option>
                <option value="medium" selected>🟡 ปานกลาง (คำทั่วไป)</option>
                <option value="hard">🔴 ยาก (คำยาว/ศัพท์ยาก)</option>
                <option value="sentence">💬 ประโยคฝึกพิมพ์</option>
                <option value="keyboard">⌨️ ฝึกกดแป้นพิมพ์</option>
                <option value="challenge">🏆 ท้าทาย (Challenge)</option>
            </select>
        </div>
        <div class="stats-hud">
            <div class="stat-box">SCORE: <span id="hud-score" class="stat-val">0</span></div>
            <div class="stat-box">COMBO: <span id="hud-combo" class="stat-val" style="color:#fb923c">x0</span></div>
        </div>
    </header>

    <main onclick="focusInput()">
        <div class="battle-screen">
            <div class="hp-bars">
                <div class="hp-container">
                    <div class="hp-info">
                        <span id="hero-name" style="color:#a5b4fc">HERO LV.1</span>
                        <span id="hero-hp-text" style="color:#4ade80">100 / 100</span>
                    </div>
                    <div class="hp-bg"><div id="hero-hp-bar" class="hp-fill-hero"></div></div>
                </div>

                <div class="vs-badge">VS</div>

                <div class="hp-container">
                    <div class="hp-info">
                        <span id="monster-hp-text" style="color:#f87171">150 / 150</span>
                        <span id="monster-name" style="color:#fca5a5">DEVIL LV.1</span>
                    </div>
                    <div class="hp-bg"><div id="monster-hp-bar" class="hp-fill-monster"></div></div>
                </div>
            </div>

            <div class="stage">
                <img id="hero-sprite" class="sprite-img" src="pictures/heroA1.png" alt="Hero">
                <img id="monster-sprite" class="sprite-img" src="pictures/devilA1.png" alt="Monster">
            </div>
        </div>

        <div class="target-card">
            <div class="target-label">กดคลิกบริเวณนี้หากพิมพ์ไม่ติด / TYPE THIS WORD</div>
            <div id="word-target-container" class="word-container">กำลังเตรียมคำศัพท์...</div>
            <div class="finger-hint">
                💡 ปุ่มถัดไปที่ต้องกด: <span id="key-name" style="color:#facc15; font-weight: bold; font-size: 1.1rem;">-</span>
            </div>
        </div>
    </main>

    <footer>
        <div id="virtual-keyboard" class="keyboard-wrapper">
            <div id="kb-row-1" class="kb-row"></div>
            <div id="kb-row-2" class="kb-row"></div>
            <div id="kb-row-3" class="kb-row"></div>
            <div id="kb-row-4" class="kb-row"></div>
            <div id="kb-row-5" class="kb-row"></div>
        </div>
        <div class="credit-footer">
            พัฒนาโดย <span>เพจครูไนท์ and ครูน้ำ</span>
        </div>
    </footer>

    <script>
        const wordDatabase = {
            "easy": ["มด", "นก", "ปลา", "แมว", "หมา", "ช้าง", "บ้าน", "ดาว", "น้ำ", "ต้นไม้", "ไฟ", "ลม", "ดิน", "ฟ้า", "ฝน", "ขนม", "สมุด", "ดินสอ", "ปากกา", "เก้าอี้", "โต๊ะ", "หนังสือ"],
            "medium": ["มีความสุข", "ยิ้มสยาม", "ดวงอาทิตย์", "กระต่าย", "ม้าลาย", "ผีเสื้อ", "ประเทศไทย", "คอมพิวเตอร์", "โรงเรียน", "โรงพยาบาล", "ธรรมชาติ", "ก้อนเมฆ"],
            "hard": ["พฤศจิกายน", "วัฒนธรรม", "วิทยาศาสตร์", "ทรัพยากร", "อุตสาหกรรม", "สถาปัตยกรรม", "เกษตรกรรม", "ปรัชญา", "อารยธรรม", "ประวัติศาสตร์"],
            "sentence": ["ฉันรักโรงเรียน", "วันนี้อากาศดี", "แมวกำลังนอน", "เด็กกำลังเล่น", "ฉันชอบเรียนคอมพิวเตอร์"],
            "keyboard": ["asdf", "jkl;", "asdfjkl", "กหฟด", "สวง", "ปแอ", "รนย", "ฟหกด"],
            "challenge": ["คอมพิวเตอร์", "ปัญญาประดิษฐ์", "การคิดสร้างสรรค์", "สิ่งแวดล้อม", "เทคโนโลยีการศึกษา"]
        };

        const REALISTIC_TH_LAYOUT = [
            [
                { key: '_', shiftKey: '%', special: true, flex: 0.8 },
                { key: 'า', shiftKey: '1' }, { key: 'า', shiftKey: '2' }, { key: '_', shiftKey: '3' }, { key: 'ุ', shiftKey: '4' },
                { key: 'ึ', shiftKey: '5' }, { key: 'ค', shiftKey: '6' }, { key: 'ต', shiftKey: '7' }, { key: 'จ', shiftKey: '8' },
                { key: 'ข', shiftKey: '9' }, { key: 'ช', shiftKey: '0' }, { key: 'โ', shiftKey: '-' }, { key: 'ฑ', shiftKey: '=' },
                { key: 'Backspace', special: true, flex: 1.5 }
            ],
            [
                { key: 'Tab', special: true, flex: 1.3 },
                { key: 'ๆ', shiftKey: '0' }, { key: 'ไ', shiftKey: '"' }, { key: 'ำ', shiftKey: 'ฎ' }, { key: 'พ', shiftKey: 'ฑ' },
                { key: 'ะ', shiftKey: 'ธ' }, { key: 'ั', shiftKey: 'ํ' }, { key: 'ี', shiftKey: '๊' }, { key: 'ร', shiftKey: 'ณ' },
                { key: 'น', shiftKey: 'ฯ' }, { key: 'ย', shiftKey: 'ญ' }, { key: 'บล', shiftKey: 'ฐ' }, { key: 'ฃ', shiftKey: 'ฅ' },
                { key: '\\', special: true, flex: 1 }
            ],
            [
                { key: 'Caps Lock', special: true, flex: 1.6 },
                { key: 'ฟ', shiftKey: 'ฤ' }, { key: 'ห', shiftKey: 'ฆ' }, { key: 'ก', shiftKey: 'ฏ' }, { key: 'ด', shiftKey: 'โ' },
                { key: 'เ', shiftKey: 'ฌ' }, { key: '้', shiftKey: '็' }, { key: '่', shiftKey: '่' }, { key: 'า', shiftKey: 'ษ' },
                { key: 'ส', shiftKey: 'ศ' }, { key: 'ว', shiftKey: 'ซ' }, { key: 'ง', shiftKey: '.' },
                { key: 'Enter', special: true, flex: 1.8 }
            ],
            [
                { key: 'Shift', special: true, flex: 2 },
                { key: 'ผ', shiftKey: '(' }, { key: 'ป', shiftKey: ')' }, { key: 'แ', shiftKey: 'ฉ' }, { key: 'อ', shiftKey: 'ฮ' },
                { key: 'ิ', shiftKey: 'ฺ' }, { key: 'ท', shiftKey: '์' }, { key: 'ม', shiftKey: 'ฒ' }, { key: 'ใ', shiftKey: 'ฬ' },
                { key: 'ฝ', shiftKey: 'ฦ' },
                { key: 'Shift', special: true, flex: 2 }
            ],
            [
                { key: 'Ctrl', special: true, flex: 1.2 }, { key: 'Alt', special: true, flex: 1.2 },
                { key: ' ', code: 'Space', special: true, flex: 6, label: 'Spacebar' },
                { key: 'Alt', special: true, flex: 1.2 }, { key: 'Ctrl', special: true, flex: 1.2 }
            ]
        ];

        const HEROES = [
            { name: "HERO LV.1", img: "pictures/heroA1.png" },
            { name: "HERO LV.2", img: "pictures/heroB2.png" },
            { name: "HERO LV.3", img: "pictures/heroC3.png" }
        ];

        const MONSTERS = [
            { name: "DEVIL LV.1", hp: 150, img: "pictures/devilA1.png" },
            { name: "DEVIL LV.2", hp: 250, img: "pictures/devilB2.png" },
            { name: "DEVIL LV.3", hp: 400, img: "pictures/devilC3.png" }
        ];

        let currentMode = "medium";

        let gameState = { 
            currentWord: "", 
            charIndex: 0, 
            score: 0,
            combo: 0,
            heroIndex: 0,
            monsterIndex: 0,
            monsterHp: 150,
            maxMonsterHp: 150
        };

        const hiddenInput = document.getElementById('hidden-input');

        window.onload = () => {
            renderKeyboard();
            initMonster();
            updateHeroUI();
            nextWord();
            focusInput();
            setupInput();
        };

        function changeMode(newMode) {
            currentMode = newMode;
            nextWord();
            focusInput();
        }

        function focusInput() { hiddenInput.focus(); }

        function setupInput() {
            hiddenInput.addEventListener('input', (e) => {
                const char = e.data;
                hiddenInput.value = '';
                if (char) processChar(char);
            });
            
            window.addEventListener('keydown', (e) => {
                if (e.key === ' ') {
                    e.preventDefault();
                    processChar(' ');
                }
                focusInput();
            });
        }

        function initMonster() {
            const m = MONSTERS[gameState.monsterIndex];
            gameState.monsterHp = m.hp;
            gameState.maxMonsterHp = m.hp;
            document.getElementById('monster-name').textContent = m.name;
            document.getElementById('monster-sprite').src = m.img;
            updateHpUI();
        }

        function updateHeroUI() {
            const h = HEROES[gameState.heroIndex];
            document.getElementById('hero-name').textContent = h.name;
            document.getElementById('hero-sprite').src = h.img;
        }

        function updateHpUI() {
            const percent = (gameState.monsterHp / gameState.maxMonsterHp) * 100;
            document.getElementById('monster-hp-bar').style.width = `${percent}%`;
            document.getElementById('monster-hp-text').textContent = `${gameState.monsterHp} / ${gameState.maxMonsterHp}`;
        }

        function nextWord() {
            const wordList = wordDatabase[currentMode] || ["โรงเรียน"];
            gameState.currentWord = wordList[Math.floor(Math.random() * wordList.length)];
            gameState.charIndex = 0;
            renderWord();
            highlightKey();
        }

        function renderWord() {
            const container = document.getElementById('word-target-container');
            container.innerHTML = '';

            const word = gameState.currentWord;
            const clusters = [];

            for (let i = 0; i < word.length; i++) {
                const char = word[i];
                const code = char.charCodeAt(0);
                const isThaiDiacritic = (code >= 0x0E31 && code <= 0x0E3A) || (code >= 0x0E47 && code <= 0x0E4E);

                if (isThaiDiacritic && clusters.length > 0) {
                    clusters[clusters.length - 1].text += char;
                    clusters[clusters.length - 1].endIndex = i;
                } else {
                    clusters.push({ text: char, startIndex: i, endIndex: i });
                }
            }

            clusters.forEach(cluster => {
                const span = document.createElement('span');
                
                if (cluster.text === ' ') {
                    span.textContent = ' ';
                    span.className = 'space-char';
                } else {
                    span.textContent = cluster.text;
                }

                if (gameState.charIndex > cluster.endIndex) {
                    span.className += ' char-correct';
                } else if (gameState.charIndex >= cluster.startIndex && gameState.charIndex <= cluster.endIndex) {
                    span.className += ' char-current';
                } else {
                    span.className += ' char-pending';
                }

                container.appendChild(span);
            });
        }

        function processChar(typedChar) {
            const targetChar = gameState.currentWord[gameState.charIndex];
            if (typedChar === targetChar) {
                gameState.charIndex++;
                gameState.combo++;
                gameState.score += 10 + (gameState.combo * 2);
                
                document.getElementById('hud-score').textContent = gameState.score;
                document.getElementById('hud-combo').textContent = `x${gameState.combo}`;

                if (gameState.charIndex >= gameState.currentWord.length) {
                    attackMonster();
                    nextWord();
                } else {
                    renderWord();
                    highlightKey();
                }
            } else {
                gameState.combo = 0;
                document.getElementById('hud-combo').textContent = `x0`;
            }
        }

        function attackMonster() {
            const hero = document.getElementById('hero-sprite');
            const monster = document.getElementById('monster-sprite');

            hero.classList.add('attack-hero');
            setTimeout(() => hero.classList.remove('attack-hero'), 150);

            setTimeout(() => {
                monster.classList.add('hit-monster');
                setTimeout(() => monster.classList.remove('hit-monster'), 200);
            }, 100);

            const damage = Math.max(30, gameState.currentWord.length * 10);
            gameState.monsterHp = Math.max(0, gameState.monsterHp - damage);
            updateHpUI();

            if (gameState.monsterHp <= 0) {
                setTimeout(() => {
                    alert(`⚔️ พิชิต ${MONSTERS[gameState.monsterIndex].name} สำเร็จ!`);
                    gameState.monsterIndex = (gameState.monsterIndex + 1) % MONSTERS.length;
                    gameState.heroIndex = (gameState.heroIndex + 1) % HEROES.length;
                    
                    initMonster();
                    updateHeroUI();
                }, 250);
            }
        }

        function renderKeyboard() {
            for (let r = 0; r < REALISTIC_TH_LAYOUT.length; r++) {
                const rowEl = document.getElementById(`kb-row-${r + 1}`);
                rowEl.innerHTML = '';
                REALISTIC_TH_LAYOUT[r].forEach(k => {
                    const keyDiv = document.createElement('div');
                    keyDiv.className = 'key-base' + (k.special ? ' key-special' : '');
                    if (k.flex) keyDiv.style.flex = k.flex;
                    
                    keyDiv.dataset.key = k.key || '';
                    keyDiv.dataset.shift = k.shiftKey || '';
                    if (k.code) keyDiv.dataset.code = k.code;

                    if (k.label) {
                        keyDiv.textContent = k.label;
                    } else if (k.special) {
                        keyDiv.textContent = k.key;
                    } else {
                        keyDiv.innerHTML = `
                            <span class="key-sub">${k.shiftKey || ''}</span>
                            <span>${k.key}</span>
                        `;
                    }
                    rowEl.appendChild(keyDiv);
                });
            }
        }

        function highlightKey() {
            document.querySelectorAll('.key-base').forEach(el => el.classList.remove('glow-key'));
            const targetChar = gameState.currentWord[gameState.charIndex];
            if (!targetChar) return;

            if (targetChar === ' ') {
                const spaceKey = document.querySelector('[data-code="Space"]');
                if (spaceKey) spaceKey.classList.add('glow-key');
                document.getElementById('key-name').textContent = 'Spacebar (เว้นวรรค)';
            } else {
                document.querySelectorAll('.key-base').forEach(el => {
                    if (el.dataset.key === targetChar || el.dataset.shift === targetChar) {
                        el.classList.add('glow-key');
                    }
                });
                document.getElementById('key-name').textContent = targetChar;
            }
        }
    </script>
</body>
</html>
